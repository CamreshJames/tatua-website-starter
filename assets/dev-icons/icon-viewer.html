<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Icons Collection - Professional Icon Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --dark-gradient: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --error-color: #e74c3c;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --text-muted: #95a5a6;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #ecf0f1;
            --border-color: #e0e6ed;
            --shadow-light: 0 2px 10px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 25px rgba(0, 0, 0, 0.12);
            --shadow-heavy: 0 15px 35px rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
            --border-radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            line-height: 1.6;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                radial-gradient(circle at 25% 25%, #fff 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, #fff 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-heavy);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .header {
            padding: 40px 40px 30px;
            text-align: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-section {
            padding: 30px 40px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 25px;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 24px;
            font-size: 1.1rem;
            font-weight: 400;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            background: var(--bg-primary);
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-light);
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1), var(--shadow-medium);
            transform: translateY(-1px);
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .search-icon {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-transform: capitalize;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow-medium);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
        }

        .stat-icon {
            width: 18px;
            height: 18px;
            color: #667eea;
        }

        .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .content-section {
            padding: 40px;
        }

        .view-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .view-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .view-btn.active {
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: var(--shadow-light);
        }

        .sort-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sort-select {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .icons-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .icons-grid.list {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .icon-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 24px;
            text-align: center;
            transition: var(--transition);
            border: 2px solid var(--border-color);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            group: hover;
        }

        .icon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .icon-card:hover::before {
            left: 100%;
        }

        .icon-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-heavy);
            border-color: #667eea;
        }

        .icon-card.list {
            display: flex;
            align-items: center;
            text-align: left;
            padding: 16px 20px;
        }

        .icon-display {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .icon-card:hover .icon-display {
            background: var(--primary-gradient);
            transform: scale(1.05);
        }

        .icon-card.list .icon-display {
            margin: 0 16px 0 0;
            width: 40px;
            height: 40px;
        }

        .icon-display svg {
            width: 32px;
            height: 32px;
            transition: var(--transition);
            color: var(--text-primary);
        }

        .icon-card:hover .icon-display svg {
            color: white;
            transform: scale(1.1);
        }

        .icon-card.list .icon-display svg {
            width: 24px;
            height: 24px;
        }

        .icon-info {
            flex: 1;
        }

        .icon-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .icon-card.list .icon-name {
            margin-bottom: 2px;
        }

        .icon-filename {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 500;
        }

        .icon-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            opacity: 0;
            transition: var(--transition);
        }

        .icon-card:hover .icon-actions {
            opacity: 1;
        }

        .icon-card.list .icon-actions {
            margin-top: 0;
            margin-left: auto;
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .action-btn:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            display: none;
        }

        .no-results-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            opacity: 0.3;
            color: var(--text-muted);
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .no-results p {
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: var(--success-color);
            color: white;
            padding: 16px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-heavy);
            transform: translateX(400px);
            transition: var(--transition);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-icon {
            width: 20px;
            height: 20px;
        }

        .loading-spinner {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 30px 20px 20px;
            }

            .controls-section {
                padding: 20px;
            }

            .content-section {
                padding: 20px;
            }

            .icons-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .view-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-bar {
                gap: 15px;
            }

            .stat-item {
                flex: 1;
                justify-content: center;
            }

            .notification {
                top: 20px;
                right: 20px;
                left: 20px;
                transform: translateY(-100px);
            }

            .notification.show {
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .icons-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .icon-card {
                padding: 16px;
            }

            .icon-display {
                width: 48px;
                height: 48px;
            }

            .icon-display svg {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="container">
        <div class="main-card">
            <div class="header">
                <h1>Dev Icons Collection</h1>
                <p>Professional SVG icon library for modern development projects</p>
            </div>

            <div class="controls-section">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search icons... (e.g., 'arrow', 'user', 'code')">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>

                <div class="filter-controls">
                    <button class="filter-btn active" data-category="all">All Icons</button>
                    <button class="filter-btn" data-category="arrow">Arrows</button>
                    <button class="filter-btn" data-category="ui">UI Elements</button>
                    <button class="filter-btn" data-category="social">Social</button>
                    <button class="filter-btn" data-category="file">Files</button>
                    <button class="filter-btn" data-category="device">Devices</button>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        </svg>
                        <div>
                            <div class="stat-number" id="totalIcons">0</div>
                            <div class="stat-label">Total Icons</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <div>
                            <div class="stat-number" id="visibleIcons">0</div>
                            <div class="stat-label">Visible</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Z"></path>
                            <path d="M13 11h4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"></path>
                            <path d="M5 11V7a7 7 0 0 1 14 0v4"></path>
                        </svg>
                        <div>
                            <div class="stat-number" id="selectedCount">0</div>
                            <div class="stat-label">Selected</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-section">
                <div class="view-controls">
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid">Grid</button>
                        <button class="view-btn" data-view="compact">Compact</button>
                        <button class="view-btn" data-view="list">List</button>
                    </div>
                    
                    <div class="sort-controls">
                        <label for="sortSelect">Sort by:</label>
                        <select class="sort-select" id="sortSelect">
                            <option value="name">Name</option>
                            <option value="category">Category</option>
                            <option value="recent">Recently Used</option>
                        </select>
                    </div>
                </div>

                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner"></div>
                </div>

                <div class="icons-grid" id="iconsGrid"></div>

                <div class="no-results" id="noResults">
                    <svg class="no-results-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <h3>No icons found</h3>
                    <p>Try adjusting your search terms or filters to find what you're looking for.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <svg class="notification-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20,6 9,17 4,12"></polyline>
        </svg>
        <span id="notificationText">Icon name copied to clipboard!</span>
    </div>

    <script>  
      // Icon data and categories
        const iconCategories = {

        };

        const allIcons = [
            'activity', 'airplay', 'alert-circle', 'alert-octagon', 'alert-triangle',
            'align-center', 'align-justify', 'align-left', 'align-right', 'anchor',
            'aperture', 'archive', 'arrow-down-circle', 'arrow-down-left', 'arrow-down-right',
            'arrow-down', 'arrow-left-circle', 'arrow-left', 'arrow-right-circle', 'arrow-right',
            'arrow-up-circle', 'arrow-up-left', 'arrow-up-right', 'arrow-up', 'at-sign',
            'award', 'bar-chart-2', 'bar-chart', 'battery-charging', 'battery',
            'bell-off', 'bell', 'bluetooth', 'bold', 'book-open',
            'book', 'bookmark', 'box', 'briefcase', 'calendar',
            'camera-off', 'camera', 'cast', 'check-circle', 'check-square',
            'check', 'chevron-down', 'chevron-left', 'chevron-right', 'chevron-up',
            'chevrons-down', 'chevrons-left', 'chevrons-right', 'chevrons-up', 'chrome',
            'circle', 'clipboard', 'clock', 'cloud-drizzle', 'cloud-lightning',
            'cloud-off', 'cloud-rain', 'cloud-snow', 'cloud', 'code',
            'codepen', 'codesandbox', 'coffee', 'columns', 'command',
            'compass', 'copy', 'corner-down-left', 'corner-down-right', 'corner-left-down',
            'corner-left-up', 'corner-right-down', 'corner-right-up', 'corner-up-left', 'corner-up-right',
            'cpu', 'credit-card', 'crop', 'crosshair', 'database',
            'delete', 'disc', 'divide-circle', 'divide-square', 'divide',
            'dollar-sign', 'download-cloud', 'download', 'dribbble', 'droplet',
            'edit-2', 'edit-3', 'edit', 'external-link', 'eye-off',
            'eye', 'facebook', 'fast-forward', 'feather', 'figma',
            'file-minus', 'file-plus', 'file-text', 'file', 'film',
            'filter', 'flag', 'folder-minus', 'folder-plus', 'folder',
            'framer', 'frown', 'gift', 'git-branch', 'git-commit',
            'git-merge', 'git-pull-request', 'github', 'gitlab', 'globe',
            'grid', 'hard-drive', 'hash', 'headphones', 'heart',
            'help-circle', 'hexagon', 'home', 'image', 'inbox',
            'info', 'instagram', 'italic', 'key', 'layers',
            'layout', 'life-buoy', 'link-2', 'link', 'linkedin',
            'list', 'loader', 'lock', 'log-in', 'log-out',
            'mail', 'map-pin', 'map', 'maximize-2', 'maximize',
            'meh', 'menu', 'message-circle', 'message-square', 'mic-off',
            'mic', 'minimize-2', 'minimize', 'minus-circle', 'minus-square',
            'minus', 'monitor', 'moon', 'more-horizontal', 'more-vertical',
            'mouse-pointer', 'move', 'music', 'navigation-2', 'navigation',
            'octagon', 'package', 'paperclip', 'pause-circle', 'pause',
            'pen-tool', 'percent', 'phone-call', 'phone-forwarded', 'phone-incoming',
            'phone-missed', 'phone-off', 'phone-outgoing', 'phone', 'pie-chart',
            'play-circle', 'play', 'plus-circle', 'plus-square', 'plus',
            'pocket', 'power', 'printer', 'radio', 'refresh-ccw',
            'refresh-cw', 'repeat', 'rewind', 'rotate-ccw', 'rotate-cw',
            'rss', 'save', 'scissors', 'search', 'send',
            'server', 'settings', 'share-2', 'share', 'shield-off',
            'shield', 'shopping-bag', 'shopping-cart', 'shuffle', 'sidebar',
            'skip-back', 'skip-forward', 'slack', 'slash', 'sliders',
            'smartphone', 'smile', 'speaker', 'square', 'star',
            'stop-circle', 'sun', 'sunrise', 'sunset', 'table',
            'tablet', 'tag', 'target', 'terminal', 'thermometer',
            'thumbs-down', 'thumbs-up', 'toggle-left', 'toggle-right', 'tool',
            'trash-2', 'trash', 'trello', 'trending-down', 'trending-up',
            'triangle', 'truck', 'tv', 'twitch', 'twitter',
            'type', 'umbrella', 'underline', 'unlock', 'upload-cloud',
            'upload', 'user-check', 'user-minus', 'user-plus', 'user-x',
            'user', 'users', 'video-off', 'video', 'voicemail',
            'volume-1', 'volume-2', 'volume-x', 'volume', 'watch',
            'wifi-off', 'wifi', 'wind', 'x-circle', 'x-octagon',
            'x-square', 'x', 'youtube', 'zap-off', 'zap',
            'zoom-in', 'zoom-out'
        ];

        // State management
        let currentView = 'grid';
        let currentFilter = 'all';
        let currentSort = 'name';
        let searchTerm = '';
        let filteredIcons = [...allIcons];
        let selectedIcons = new Set();
        let recentlyUsed = JSON.parse(localStorage.getItem('recentlyUsedIcons') || '[]');

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const iconsGrid = document.getElementById('iconsGrid');
        const noResults = document.getElementById('noResults');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const totalIconsEl = document.getElementById('totalIcons');
        const visibleIconsEl = document.getElementById('visibleIcons');
        const selectedCountEl = document.getElementById('selectedCount');
        const sortSelect = document.getElementById('sortSelect');

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            setupEventListeners();
            loadIcons();
        });

        function initializeApp() {
            totalIconsEl.textContent = allIcons.length;
            updateStats();
        }

        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', debounce(handleSearch, 300));

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', handleFilterChange);
            });

            // View toggle buttons
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', handleViewChange);
            });

            // Sort select
            sortSelect.addEventListener('change', handleSortChange);

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboardShortcuts);
        }

        function handleSearch(e) {
            searchTerm = e.target.value.toLowerCase().trim();
            filterAndRenderIcons();
        }

        function handleFilterChange(e) {
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            currentFilter = e.target.dataset.category;
            filterAndRenderIcons();
        }

        function handleViewChange(e) {
            // Update active view button
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            currentView = e.target.dataset.view;
            updateGridView();
        }

        function handleSortChange(e) {
            currentSort = e.target.value;
            filterAndRenderIcons();
        }

        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + F to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchInput.focus();
            }
            
            // Escape to clear search
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchTerm = '';
                filterAndRenderIcons();
            }
        }

        function filterAndRenderIcons() {
            showLoading();
            
            setTimeout(() => {
                // Apply filters
                filteredIcons = allIcons.filter(icon => {
                    // Search filter
                    const matchesSearch = !searchTerm || 
                        icon.toLowerCase().includes(searchTerm) ||
                        formatIconName(icon).toLowerCase().includes(searchTerm);
                    
                    // Category filter
                    const matchesCategory = currentFilter === 'all' || 
                        (iconCategories[currentFilter] && iconCategories[currentFilter].includes(icon));
                    
                    return matchesSearch && matchesCategory;
                });

                // Apply sorting
                sortIcons();
                
                // Render icons
                renderIcons();
                hideLoading();
                updateStats();
            }, 100);
        }

        function sortIcons() {
            filteredIcons.sort((a, b) => {
                switch (currentSort) {
                    case 'name':
                        return a.localeCompare(b);
                    case 'category':
                        const categoryA = getIconCategory(a);
                        const categoryB = getIconCategory(b);
                        return categoryA.localeCompare(categoryB) || a.localeCompare(b);
                    case 'recent':
                        const indexA = recentlyUsed.indexOf(a);
                        const indexB = recentlyUsed.indexOf(b);
                        if (indexA === -1 && indexB === -1) return a.localeCompare(b);
                        if (indexA === -1) return 1;
                        if (indexB === -1) return -1;
                        return indexA - indexB;
                    default:
                        return a.localeCompare(b);
                }
            });
        }

        function getIconCategory(iconName) {
            for (const [category, icons] of Object.entries(iconCategories)) {
                if (icons.includes(iconName)) {
                    return category;
                }
            }
            return 'misc';
        }
        

        function loadIcons() {
            showLoading();
            filterAndRenderIcons();
        }

        function renderIcons() {
            iconsGrid.innerHTML = '';
            
            if (filteredIcons.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            filteredIcons.forEach((iconName, index) => {
                const iconCard = createIconCard(iconName, index);
                iconsGrid.appendChild(iconCard);
            });
            
            // Add fade-in animation
            iconsGrid.classList.add('fade-in');
            setTimeout(() => iconsGrid.classList.remove('fade-in'), 500);
        }

        function createIconCard(iconName, index) {
            const card = document.createElement('div');
            card.className = `icon-card ${currentView === 'list' ? 'list' : ''}`;
            card.style.animationDelay = `${index * 0.02}s`;
            
            const displayName = formatIconName(iconName);
            const category = getIconCategory(iconName);
            const filename = `${iconName}.svg`;
            
            card.innerHTML = `
                <div class="icon-display">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <!-- SVG content will be loaded here -->
                    </svg>
                </div>
                <div class="icon-info">
                    <div class="icon-name">${displayName}</div>
                    <div class="icon-filename">${filename}</div>
                    <div class="icon-actions">
                        <button class="action-btn" onclick="copyIconName('${iconName}')">Copy Name</button>
                        <button class="action-btn" onclick="downloadIcon('${iconName}')">Download</button>
                    </div>
                </div>
            `;
            
            // Load SVG content
            loadSVGContent(card.querySelector('svg'), iconName);
            
            // Add click handler for selection
            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('action-btn')) {
                    toggleIconSelection(iconName, card);
                }
            });
            
            return card;
        }

        function loadSVGContent(svgElement, iconName) {
            fetch(`${iconName}.svg`)
                .then(response => response.text())
                .then(svgContent => {
                    // Extract the inner content of the SVG
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
                    const svgNode = svgDoc.querySelector('svg');
                    
                    if (svgNode) {
                        // Copy all child elements
                        svgElement.innerHTML = svgNode.innerHTML;
                        
                        // Copy important attributes
                        if (svgNode.getAttribute('viewBox')) {
                            svgElement.setAttribute('viewBox', svgNode.getAttribute('viewBox'));
                        }
                    }
                })
                .catch(() => {
                    // Fallback icon if loading fails
                    svgElement.innerHTML = `
                        <rect x="2" y="2" width="20" height="20" rx="2" ry="2"/>
                        <path d="M8 12h8"/>
                        <path d="M12 8v8"/>
                    `;
                });
        }

        function formatIconName(iconName) {
            return iconName
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function updateGridView() {
            iconsGrid.className = `icons-grid ${currentView}`;
            
            // Re-render to apply new view classes
            const cards = iconsGrid.querySelectorAll('.icon-card');
            cards.forEach(card => {
                card.className = `icon-card ${currentView === 'list' ? 'list' : ''}`;
            });
        }

        function toggleIconSelection(iconName, cardElement) {
            if (selectedIcons.has(iconName)) {
                selectedIcons.delete(iconName);
                cardElement.classList.remove('selected');
            } else {
                selectedIcons.add(iconName);
                cardElement.classList.add('selected');
            }
            updateStats();
        }

        function copyIconName(iconName) {
            navigator.clipboard.writeText(iconName).then(() => {
                addToRecentlyUsed(iconName);
                showNotification(`"${iconName}" copied to clipboard!`);
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = iconName;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                addToRecentlyUsed(iconName);
                showNotification(`"${iconName}" copied to clipboard!`);
            });
        }

        function downloadIcon(iconName) {
            const link = document.createElement('a');
            link.href = `${iconName}.svg`;
            link.download = `${iconName}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            addToRecentlyUsed(iconName);
            showNotification(`"${iconName}.svg" downloaded!`);
        }

        function addToRecentlyUsed(iconName) {
            recentlyUsed = recentlyUsed.filter(name => name !== iconName);
            recentlyUsed.unshift(iconName);
            recentlyUsed = recentlyUsed.slice(0, 20); // Keep only last 20
            localStorage.setItem('recentlyUsedIcons', JSON.stringify(recentlyUsed));
        }

        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function showLoading() {
            loadingSpinner.style.display = 'flex';
            iconsGrid.style.opacity = '0.5';
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
            iconsGrid.style.opacity = '1';
        }

        function updateStats() {
            visibleIconsEl.textContent = filteredIcons.length;
            selectedCountEl.textContent = selectedIcons.size;
        }

        // Utility function for debouncing
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Add some CSS for selected state
        const style = document.createElement('style');
        style.textContent = `
            .icon-card.selected {
                border-color: #667eea !important;
                background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
                transform: translateY(-2px);
            }
            
            .icon-card.selected .icon-display {
                background: var(--primary-gradient);
            }
            
            .icon-card.selected .icon-display svg {
                color: white;
            }
        `;
        document.head.appendChild(style);
    </script>
